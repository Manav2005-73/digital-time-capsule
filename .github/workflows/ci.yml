name: ChronoCapsule CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chronocapsule .

      - name: Run Docker container
        run: |
          docker run -d --name chronocapsule -p 3000:3000 chronocapsule
          sleep 5

      - name: Check application health
        run: curl --fail http://localhost:3000/health

      - name: Stop Docker container
        run: docker stop chronocapsule
    deploy:
    needs: [test-and-lint, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --request POST "$RENDER_DEPLOY_HOOK"